name: Publicar sistema

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependências
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Compilar aplicação
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://fhbmervgidsixgkjylym.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZoYm1lcnZnaWRzaXhna2p5bHltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5Njg4NzEsImV4cCI6MjA5MjU0NDg3MX0.tSkxAHgQlvqnw2cUjKR9UFvS8CiLcGc-z7EhatDTOp0
      - name: Preparar rotas da SPA
        run: cp dist/index.html dist/404.html
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Empacotar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
