name: Publicar sistema

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependências
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Compilar aplicação
        run: npm run build
        env:
          VITE_BASE_PATH: /sistema/
          VITE_SUPABASE_URL: https://mzwnljgujheumdslkloc.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Jqag5UA-0ydYsDgYuTxYhQ_AJT5fylh
      - name: Preparar rotas da SPA
        run: cp dist/index.html dist/404.html
      - name: Publicar branch do site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
